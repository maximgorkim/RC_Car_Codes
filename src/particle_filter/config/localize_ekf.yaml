# Particle filter as the LiDAR pose source of rc_localization's EKF.
# Same as localize.yaml except the block below and viz.
#   ros2 launch particle_filter localize_launch.py ekf:=true
#   ros2 launch rc_localization ekf_localization.launch.py pose_stamp_offset:=0.0   (publish_tf stays true)
particle_filter:
  ros__parameters:
    # --- EKF mode
    publish_tf: false              # the EKF publishes odom -> base_link
    scan_synchronous: true         # one update per scan, pose stamped with the scan time
    motion_source: 'twist'         # VESC + IMU twist instead of ZED visual odometry
    twist_topic: '/localization/twist_with_cov'
    # topic names
    scan_topic: '/scan'
    odometry_topic: '/zed2/zed_node/odom'
    # range data downsampling
    angle_step: 12
    max_particles: 4000
    squash_factor: 2.2
    # visualization
    viz: 0                         # visualization off on the car (CPU)
    max_viz_particles: 60
    # ray marching method
    range_method: 'rmgpu'
    theta_discretization: 112
    # range data filtering
    max_range: 20
    fine_timing: 0
    publish_odom: 1
    # sensor model constants
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 3.0
    # motion model dispersion constants
    motion_dispersion_x: 0.15
    motion_dispersion_y: 0.08  
    motion_dispersion_theta: 0.4
    # sensor model variant, variant 2 good for rmgpu, 3 doesn't work for rmgpu
    rangelib_variant: 2

map_server:
  ros__parameters:
    # assuming map file is in particle_filter/maps
    map: 'my_map__'
